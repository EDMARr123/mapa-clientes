function avatar(nome, cor, tam) {
  const f = FOTOS[String(nome || "").toUpperCase().trim()];
  const borda = `border:3px solid ${cor};`;
  if (f) return `<img src="${f}" style="width:${tam}px;height:${tam}px;border-radius:50%;object-fit:cover;flex:none;${borda}">`;
  const ini = String(nome || "?").split(/\s+/).slice(0, 2).map(p => p[0]).join("");
  return `<div style="width:${tam}px;height:${tam}px;border-radius:50%;flex:none;background:${cor};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:${Math.round(tam * 0.38)}px">${ini}</div>`;
}
const mapa = L.map("mapa", { zoomControl: true }).setView([-16.69, -49.27], 11);
// Fundo Esri: os servidores do OpenStreetMap e do CARTO bloqueiam página
// aberta direto do disco (file://); o da Esri não pede chave.
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 19, attribution: "Tiles &copy; Esri" }).addTo(mapa);

// max mais alto = o vermelho fica só onde há muitos clientes juntos
const calor = L.heatLayer(TODOS.map(t => [t[0], t[1]]), { radius: 18, blur: 16, maxZoom: 13, max: 8, minOpacity: 0.3,
  gradient: { 0.2: "#3b82f6", 0.45: "#22c55e", 0.65: "#facc15", 0.85: "#f97316", 1: "#dc2626" } }).addTo(mapa);

const brl = v => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
function icone(cor) {
  return L.divIcon({ className: "pin", iconSize: [24, 34], iconAnchor: [12, 33], popupAnchor: [0, -28],
    html: `<svg width="24" height="34" viewBox="0 0 24 34"><path d="M12 0C5.4 0 0 5.3 0 11.9 0 20.8 12 34 12 34s12-13.2 12-22.1C24 5.3 18.6 0 12 0z" fill="${cor}"/><circle cx="12" cy="12" r="4.6" fill="#fff"/></svg>` });
}
const grupos = {};
PINOS.forEach(p => {
  (grupos[p.sup] = grupos[p.sup] || L.layerGroup().addTo(mapa));
  L.marker([p.lat, p.lng], { icon: icone(CORES[p.sup] || CORES.OUTROS) })
    .bindPopup(`<b>${p.cli}</b><br>${p.bairro}<br><span style="color:#C23B3B">Sai de:</span> ${p.de}<br><span style="color:#1D9A5D">Vai para:</span> <b>${p.para}</b><br>Faturamento: <b>${brl(p.fat)}</b>${p.prec === "cidade" ? "<br><i>localização aproximada (centro da cidade)</i>" : ""}`)
    .addTo(grupos[p.sup]);
});

const leg = document.getElementById("legenda");
Object.keys(grupos).sort().forEach(s => {
  const n = PINOS.filter(p => p.sup === s).length;
  const lab = document.createElement("label");
  lab.innerHTML = `<input type="checkbox" checked data-sup="${s}"><span class="dot" style="background:${CORES[s] || CORES.OUTROS}"></span>${s}<span class="cnt">${n}</span>`;
  leg.appendChild(lab);
});
// ---- Escolha de vendedores (um ou vários) ----
// Cores fixas por ordem de marcação, pra distinguir os vendedores no mapa
const PALETA = ["#2a78d6", "#e8452c", "#1baf7a", "#9b4dca", "#eda100", "#e87ba4", "#0e7c86", "#8a5a2b",
                "#4a3aa7", "#d4a017", "#c2185b", "#2e7d32", "#5d6d7e", "#ff7043", "#00838f", "#6d4c41"];
const lista = document.getElementById("listaVend");
const porSup = {};
VENDEDORES.forEach(v => (porSup[v.sup] = porSup[v.sup] || []).push(v));
lista.innerHTML = Object.keys(porSup).sort().map(s =>
  `<div class="grp"><input type="checkbox" class="chkGrp" data-sup="${s}"><span class="dot" style="background:${CORES[s] || CORES.OUTROS}"></span>${s} (equipe toda)</div>` +
  porSup[s].map(v => `<label><input type="checkbox" class="chkV" value="${v.cod}" data-sup="${s}">${v.cod} ${v.nome}<span class="cor-vend" id="cor-${v.cod}"></span></label>`).join("")
).join("");
let ordemSel = [];  // ordem em que foram marcados (define a cor)
lista.addEventListener("change", e => {
  if (e.target.classList.contains("chkGrp")) {
    lista.querySelectorAll(`.chkV[data-sup="${e.target.dataset.sup}"]`).forEach(c => c.checked = e.target.checked);
  }
  const marcados = [...lista.querySelectorAll(".chkV:checked")].map(c => Number(c.value));
  ordemSel = ordemSel.filter(c => marcados.includes(c)).concat(marcados.filter(c => !ordemSel.includes(c)));
});
document.getElementById("btnLimpar").addEventListener("click", () => {
  lista.querySelectorAll("input").forEach(c => c.checked = false);
  ordemSel = [];
  aplicar();
});
const grupoVend = L.layerGroup();
function iconeSai() {
  return L.divIcon({ className: "pin", iconSize: [22, 31], iconAnchor: [11, 30], popupAnchor: [0, -26],
    html: `<svg width="22" height="31" viewBox="0 0 24 34"><path d="M12 0C5.4 0 0 5.3 0 11.9 0 20.8 12 34 12 34s12-13.2 12-22.1C24 5.3 18.6 0 12 0z" fill="#8B948A"/><path d="M7.5 12h9" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>` });
}
function popup(p) {
  return `<b>${p.cli}</b><br>${p.bairro}<br><span style="color:#C23B3B">Sai de:</span> ${p.de}<br><span style="color:#1D9A5D">Vai para:</span> <b>${p.para}</b><br>Faturamento: <b>${brl(p.fat)}</b>${p.prec === "cidade" ? "<br><i>localização aproximada (centro da cidade)</i>" : ""}`;
}

function aplicar() {
  const sel = ordemSel.slice();
  const cod = sel.length > 0;
  const pinosOn = document.getElementById("chkPinos").checked;
  const info = document.getElementById("infoVend");
  grupoVend.clearLayers();
  calor.setOptions({ max: cod ? Math.min(8, 1.5 + sel.length * 0.5) : 8 });  // escala do calor conforme a quantidade
  document.getElementById("blocoSup").style.display = cod ? "none" : "";
  document.getElementById("blocoVend").style.display = cod ? "" : "none";
  document.getElementById("btnZoom").style.display = cod ? "" : "none";
  document.getElementById("chkPinos").parentElement.style.display = cod ? "none" : "";
  document.getElementById("qtdSel").textContent = cod ? `(${sel.length} marcado${sel.length > 1 ? "s" : ""})` : "(todos)";
  lista.querySelectorAll(".cor-vend").forEach(e => e.style.background = "transparent");
  if (!cod) {
    info.style.display = "none";
    document.getElementById("lblCalor").textContent = "Mapa de calor (todos os clientes)";
    calor.setLatLngs(TODOS.map(t => [t[0], t[1]]));
    mapa.removeLayer(grupoVend);
    leg.querySelectorAll("input").forEach(i => {
      const g = grupos[i.dataset.sup];
      (pinosOn && i.checked) ? g.addTo(mapa) : mapa.removeLayer(g);
    });
  } else {
    Object.values(grupos).forEach(g => mapa.removeLayer(g));
    const cor = {};
    sel.forEach((c, i) => { cor[c] = PALETA[i % PALETA.length]; document.getElementById("cor-" + c).style.background = cor[c]; });
    const nome = c => { const v = VENDEDORES.find(x => x.cod === c); return v ? `${v.cod} ${v.nome}` : String(c); };
    const verFica = document.getElementById("chkFica").checked;
    const verRecebe = document.getElementById("chkRecebe").checked;
    const verPerde = document.getElementById("chkPerde").checked;
    const soma = a => a.reduce((s, p) => s + p.fat, 0);
    const linhas = [], textos = [];  // textos: resumo em texto (não usado no momento)
    let carteiraTodos = [], ptsZoom = [];
    sel.forEach(c => {
      const entra = PINOS.filter(p => p.pc === c);
      // cliente que vai de um marcado pra outro marcado aparece só como "recebe"
      const sai = PINOS.filter(p => p.dc === c && !sel.includes(p.pc));
      const saiTotal = PINOS.filter(p => p.dc === c);
      const carteira = TODOS.filter(t => t[2] === c);
      const fica = carteira.filter(t => t[3] === c);
      carteiraTodos = carteiraTodos.concat(carteira);
      ptsZoom = ptsZoom.concat(carteira.map(t => [t[0], t[1]]), sai.map(p => [p.lat, p.lng]));
      if (verFica)
        fica.forEach(t => L.circleMarker([t[0], t[1]], { radius: 6, color: "#fff", weight: 1.5, fillColor: cor[c], fillOpacity: 0.9 })
          .bindPopup(`<b>${t[4]}</b><br>${t[5]}<br>Continua com <b>${nome(c)}</b><br>Faturamento: <b>${brl(t[6])}</b>${t[7] === "cidade" ? "<br><i>localização aproximada (centro da cidade)</i>" : ""}`)
          .addTo(grupoVend));
      if (verRecebe)
        entra.forEach(p => L.marker([p.lat, p.lng], { icon: icone(cor[c]) }).bindPopup(popup(p)).addTo(grupoVend));
      if (verPerde)
        sai.forEach(p => L.marker([p.lat, p.lng], { icon: iconeSai() }).bindPopup(popup(p)).addTo(grupoVend));
      const vv = VENDEDORES.find(x => x.cod === c) || {};
      const tam = sel.length === 1 ? 64 : 40;
      linhas.push(`<div style="display:flex;gap:10px;align-items:center;margin:4px 0">${avatar(vv.nome, cor[c], tam)}<div>` +
        `<div style="font-size:${sel.length === 1 ? 15 : 13}px;font-weight:800">${nome(c)}</div>` +
        `<div style="color:var(--soft);font-size:11.5px;font-weight:700">${vv.sup || ""}</div>` +
        (() => {
          const antes = TODOS.filter(t => t[3] === c);
          const fatAntes = antes.reduce((s, t) => s + t[6], 0);
          const fatDepois = carteira.reduce((s, t) => s + t[6], 0);
          const dif = fatDepois - fatAntes;
          const pct = fatAntes ? dif / fatAntes * 100 : 0;
          const corDif = dif > 0.005 ? "#1D9A5D" : dif < -0.005 ? "#C23B3B" : "var(--soft)";
          const sinal = dif > 0.005 ? "+" : "";
          const pctTxt = `${sinal}${pct.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 })}%`;
          textos.push(`*${nome(c)}* (${vv.sup || ""})\n` +
            `Ficam: ${fica.length}\n` +
            `Recebe: ${entra.length} (${brl(soma(entra))})\n` +
            `Perde: ${saiTotal.length} (${brl(soma(saiTotal))})\n` +
            `Antes: ${antes.length} clientes · ${brl(fatAntes)}\n` +
            `Depois: ${carteira.length} clientes · ${brl(fatDepois)}\n` +
            `Variação: ${sinal}${carteira.length - antes.length} clientes · ${sinal}${brl(dif)} (${pctTxt})`);
          const L = (rot, q, v, cor, peso) => `<span style="${cor ? "color:" + cor + ";" : ""}font-weight:${peso || 800}">${rot}</span>` +
            `<b style="text-align:right">${q}</b><span style="text-align:right">${v}</span>`;
          return `<div style="display:grid;grid-template-columns:auto auto auto;column-gap:10px;row-gap:1px;margin-top:3px;font-variant-numeric:tabular-nums">` +
            L("Ficam", fica.length, "", "var(--soft)") +
            L("Recebe", entra.length, brl(soma(entra)), "#1D9A5D") +
            L("Perde", saiTotal.length, brl(soma(saiTotal)), "#8B948A") +
            `<div style="grid-column:1/-1;border-top:1px solid rgba(127,127,127,.3);margin:3px 0"></div>` +
            L("Antes", antes.length, brl(fatAntes)) +
            L("Depois", carteira.length, brl(fatDepois)) +
            L("Variação", `${sinal}${carteira.length - antes.length}`, `<b style="color:${corDif}">${sinal}${brl(dif)} (${sinal}${pct.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 })}%)</b>`, corDif) +
            `</div>`;
        })() +
        `</div></div>`);
    });
    grupoVend.addTo(mapa);
    calor.setLatLngs(carteiraTodos.map(t => [t[0], t[1]]));
    document.getElementById("lblCalor").textContent = sel.length === 1
      ? `Mapa de calor (carteira de ${nome(sel[0])} depois)` : `Mapa de calor (carteira dos ${sel.length} depois)`;
    info.style.display = "block";
    info.innerHTML = linhas.join("") + (sel.length > 1 ? `<div style="margin-top:4px"><b>Total: ${carteiraTodos.length} clientes</b></div>` : "");
    // zoom só quando muda a seleção de vendedores (não ao ligar/desligar camadas)
    const chave = sel.slice().sort().join(",");
    if (chave !== ultimoVend && ptsZoom.length) mapa.fitBounds(L.latLngBounds(ptsZoom).pad(0.15));
    ultimoVend = chave;
    return finalizar();
  }
  ultimoVend = null;
  finalizar();
}
function finalizar() {
  document.getElementById("chkCalor").checked ? calor.addTo(mapa) : mapa.removeLayer(calor);
}
let ultimoVend = null;
document.querySelector(".painel").addEventListener("change", aplicar);
// Botão "Ampliar": mostra o quadro do(s) vendedor(es) grande, no meio da tela
const zoomBox = document.createElement("div");
zoomBox.style.cssText = "position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px";
zoomBox.innerHTML = `<div style="position:relative;background:var(--card);color:var(--ink);border-radius:18px;padding:26px 30px;max-width:900px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)">` +
  `<button type="button" id="btnFecharZoom" style="position:absolute;top:10px;right:14px;border:0;background:none;font-size:26px;cursor:pointer;color:var(--soft)">✕</button>` +
  `<div id="zoomConteudo" style="zoom:1.8"></div></div>`;
document.body.appendChild(zoomBox);
document.querySelector(".painel").addEventListener("click", e => {
  if (!e.target.closest("#btnZoom")) return;
  const copia = document.getElementById("infoVend").cloneNode(true);
  copia.removeAttribute("id");
  copia.querySelector("#btnZoom")?.remove();
  copia.style.display = "block";
  copia.style.margin = "0";
  const alvo = document.getElementById("zoomConteudo");
  alvo.innerHTML = "";
  alvo.appendChild(copia);
  zoomBox.style.display = "flex";
});
zoomBox.addEventListener("click", e => {
  if (e.target === zoomBox || e.target.id === "btnFecharZoom") zoomBox.style.display = "none";
});
document.addEventListener("keydown", e => { if (e.key === "Escape") zoomBox.style.display = "none"; });
aplicar();
</script></body></html>
